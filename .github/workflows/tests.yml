name: Rules tests

# The same rules live in the site (assets/app.js), the Python scripts and the widget. tests/test_rules.py runs them
# on the repo's own data and fails when two versions disagree. The other tests cover the price-check tooling
# (jsrun.py, start.py) and the PSA backlog parser. Runs when code changes (not on price checks).
on:
  push:
    branches: [main]
    paths:
      - 'assets/app.js'
      - 'widgets/**'
      - 'scripts/**'
      - 'tests/**'
      - 'pricecheck/**'
      - 'widget/claude/**'
      - 'CLAUDE.md'
      - '.github/workflows/tests.yml'
  pull_request:
    paths:
      - 'assets/app.js'
      - 'widgets/**'
      - 'scripts/**'
      - 'tests/**'
      - 'pricecheck/**'
      - 'widget/claude/**'
      - 'CLAUDE.md'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  rules:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: 22
      - name: Site, widget and Python rules agree on every snapshot
        env:
          RULES_N: '100000'
        run: python3 tests/test_rules.py
      - name: Browser calls (jsrun.py) run only the stored, untampered scripts
        run: python3 tests/test_jsrun.py
      - name: SNKRDUNK lines sent as a diff come back byte for byte (runner.js POLL ↔ salesdiff.py)
        run: python3 tests/test_salesdiff.py
      - name: Repo health check finds leftover git locks and dead run clocks
        run: python3 tests/test_doctor.py
      - name: PSA backlog schedule and page parsing
        run: python3 tests/test_psa_backlog.py
      - name: Local runs print the procedures without the repo-finding prefix
        run: python3 tests/test_start.py
      - name: Price-check pipeline (time codes, line decoders, plan) on fixtures
        run: python3 tests/test_pipeline.py
      - name: Focus watch status rules
        run: python3 tests/test_focus.py
      - name: Unattended runs only run the repo's own scripts, and every procedure command is allowed
        run: python3 tests/test_permissions.py
