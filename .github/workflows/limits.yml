name: Set limit

# Runs when you submit the site's "Save to all devices" limit or sell-target form (a GitHub issue).
# Only issues opened by the repo owner are processed. Also matches the form's title, because GitHub
# drops a form's label when the label doesn't exist in the repo (scripts/issue_labels.py).
on:
  issues:
    types: [opened, edited]

permissions:
  contents: write
  issues: write
  actions: write

# One queue per issue: several limit forms submitted together all run (a shared group
# would cancel all but one pending run); set_limit.py retries against the latest main.
concurrency:
  group: limits-${{ github.event.issue.number }}
  cancel-in-progress: false

jobs:
  set:
    if: >-
      github.event.issue.state == 'open' &&
      github.event.issue.user.login == github.repository_owner &&
      (contains(github.event.issue.labels.*.name, 'set-limit') ||
       contains(github.event.issue.labels.*.name, 'set-sell-target') ||
       startsWith(github.event.issue.title, 'Limit:') ||
       startsWith(github.event.issue.title, 'Sell target:'))
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Update data/limits.json or data/sell_targets.json
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/set_limit.py "$GITHUB_EVENT_PATH"
