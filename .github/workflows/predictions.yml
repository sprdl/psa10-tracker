name: Save predictions

# Runs when you submit the site's "Save my answers" form (a GitHub issue).
# Only issues opened by the repo owner are processed. Matches the `predict` label, or the form's
# title ("Answers ...") in case the label doesn't exist in the repo yet.
on:
  issues:
    types: [opened, edited]

permissions:
  contents: write
  issues: write
  actions: write

# One queue per issue: several answers forms submitted together all run (a shared group
# would cancel all but one pending run); it retries against the latest main.
concurrency:
  group: predict-${{ github.event.issue.number }}
  cancel-in-progress: false

jobs:
  set:
    if: >-
      github.event.issue.state == 'open' &&
      github.event.issue.user.login == github.repository_owner &&
      (contains(github.event.issue.labels.*.name, 'predict') || startsWith(github.event.issue.title, 'Answers'))
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Update data/predict.json
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/set_predictions.py "$GITHUB_EVENT_PATH"
