name: Set my limit price
description: Save a personal limit price for a card so every device sees it (filled in by the site).
title: "Limit: "
labels: ["set-limit"]
body:
  - type: input
    id: url
    attributes:
      label: SNKRDUNK URL
      description: Filled in by the site.
      placeholder: https://snkrdunk.com/apparels/455596
    validations:
      required: true
  - type: input
    id: limit
    attributes:
      label: Limit price (¥)
      description: The most you'd pay for a PSA10 listing, e.g. 60000. Use 0 to remove the limit.
      placeholder: "60000"
    validations:
      required: true
