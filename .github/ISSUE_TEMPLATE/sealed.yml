name: Log a sealed purchase
description: A box, set or packs you bought at MSRP (store, Pokémon Center, lottery). It shows under "Sealed" on the Holdings page.
title: "Sealed: "
labels: ["sealed"]
body:
  - type: dropdown
    id: type
    attributes:
      label: Type
      options:
        - Box (BOX)
        - Set / deck / special set
        - Single pack(s)
        - Other
      default: 0
    validations:
      required: true
  - type: input
    id: snkrdunk
    attributes:
      label: SNKRDUNK link
      description: The product's SNKRDUNK page (search the box/set there and copy its address). Its name and picture come from there with the next price check; you never buy it there.
      placeholder: https://snkrdunk.com/apparels/881421
  - type: input
    id: product
    attributes:
      label: Product name (optional)
      description: Only if there's no SNKRDUNK page, or you want your own name for it.
  - type: input
    id: set_code
    attributes:
      label: Set code (optional)
      description: The code printed on its cards, e.g. M6a. The site then offers the tracked cards from that set as one-tap pulls.
      placeholder: M6a
  - type: input
    id: qty
    attributes:
      label: Quantity
      description: How many boxes / sets / packs. Leave empty for 1.
      placeholder: "1"
  - type: input
    id: price
    attributes:
      label: Price paid (¥, total, MSRP)
      description: What you paid in total for all of them, e.g. 11000.
      placeholder: "11000"
    validations:
      required: true
  - type: input
    id: date
    attributes:
      label: Date bought
      description: YYYY-MM-DD. Leave empty for today.
  - type: input
    id: where
    attributes:
      label: Where (optional)
      description: e.g. Pokémon Center lottery, Yodobashi
  - type: textarea
    id: notes
    attributes:
      label: Notes (optional)
